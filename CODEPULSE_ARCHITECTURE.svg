<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>CodePulse system architecture</title>
  <desc>Dashboard, API, Redis queues, worker, Postgres with pgvector, external services and the MCP server, with the 8-step flow of one analysis.</desc>
  <style>
    .bg { fill: #ffffff; }
    .h { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .t { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 12.5px; fill: #475569; }
    .m { font-size: 12px; fill: #475569; }
    .item { fill: #ffffff; stroke-width: 1.3; }
    .core { fill: #fff7e0; stroke: #d97706; stroke-width: 2.6; }
    .line { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .badge { fill: #0f172a; }
    .bt { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .chip { stroke-width: 1.3; fill: #ffffff; stroke: #7c5cc4; }
    .chipcore { fill: #fff7e0; stroke: #d97706; stroke-width: 2.2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1010"/>

  <!-- Title -->
  <text x="40" y="48" font-size="29" font-weight="800" fill="#0f172a">CodePulse: system architecture</text>
  <text x="40" y="75" font-size="15" fill="#475569">A GitHub repo goes in, a 0–100 health score comes out. The API stays fast, a separate worker does the slow work, and Postgres is the source of truth.</text>
  <rect x="1215" y="34" width="22" height="16" rx="4" fill="#fff7e0" stroke="#d97706" stroke-width="2.4"/>
  <text x="1245" y="47" font-size="13.5" fill="#475569">= the reliability core (explain this first)</text>

  <!-- ============ CLIENTS ============ -->
  <rect x="40" y="110" width="260" height="220" rx="12" fill="#fff7ea" stroke="#d08a00" stroke-width="1.8"/>
  <text class="h" x="56" y="136">Dashboard</text>
  <text class="s" x="56" y="156">Next.js 16 · React 19 · dashboard/</text>
  <text class="s" x="56" y="186">Repo list, score trend, findings,</text>
  <text class="s" x="56" y="204">AI chat, debate, cluster map</text>
  <text class="s" x="56" y="236">Clerk sign-in → JWT on every call</text>
  <text class="s" x="56" y="266">Live pipeline view</text>
  <text class="s" x="56" y="284">(Socket.IO client)</text>

  <rect x="40" y="350" width="260" height="82" rx="12" fill="#fff7ea" stroke="#d08a00" stroke-width="1.8"/>
  <text class="h" x="56" y="376">GitHub</text>
  <text class="s" x="56" y="398">Push webhook (HMAC-signed)</text>
  <text class="s" x="56" y="416">App install redirect</text>

  <rect x="40" y="452" width="260" height="68" rx="12" fill="#fff7ea" stroke="#d08a00" stroke-width="1.8"/>
  <text class="h" x="56" y="478">Clerk</text>
  <text class="s" x="56" y="500">Hosted login, issues JWTs</text>

  <!-- ============ API ============ -->
  <rect x="380" y="110" width="340" height="410" rx="12" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.8"/>
  <text class="h" x="396" y="134">API · Express 5 · api/</text>

  <rect class="item" x="400" y="150" width="300" height="75" rx="8" stroke="#3b6fd4"/>
  <text class="t" x="414" y="172">Socket.IO server</text>
  <text class="s" x="414" y="192">Subscribes to Redis pub/sub and</text>
  <text class="s" x="414" y="210">forwards events to browsers</text>

  <rect class="item" x="400" y="245" width="300" height="90" rx="8" stroke="#3b6fd4"/>
  <text class="t" x="414" y="267">Auth + routes</text>
  <text class="s" x="414" y="288">requireClerk (JWT) · verifyGithub (HMAC)</text>
  <text class="s" x="414" y="306">analyze · webhook · install · chat · findings</text>
  <text class="s" x="414" y="324">settings · api-keys · clusters</text>

  <rect class="core" x="400" y="355" width="300" height="85" rx="8"/>
  <text class="t" x="414" y="377">queue.js: createRunAndEnqueue</text>
  <text class="s" x="414" y="398">1. INSERT AnalysisRun (status QUEUED)</text>
  <text class="s" x="414" y="416">2. add 5 jobs, jobId = runId</text>

  <rect class="item" x="400" y="455" width="300" height="50" rx="8" stroke="#3b6fd4"/>
  <text class="t" x="414" y="476">services/tools.js</text>
  <text class="s" x="414" y="494">7 AI tools, shared by chat and MCP</text>

  <!-- ============ REDIS ============ -->
  <rect x="800" y="110" width="280" height="410" rx="12" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <text class="h" x="816" y="134">Redis</text>

  <rect class="item" x="816" y="150" width="248" height="75" rx="8" stroke="#c0392b"/>
  <text class="t" x="830" y="172">Pub/Sub channels</text>
  <text class="s" x="830" y="192">worker-event · health-update</text>
  <text class="s" x="830" y="210">(live signal, messages not stored)</text>

  <rect class="item" x="816" y="245" width="248" height="260" rx="8" stroke="#c0392b"/>
  <text class="t" x="830" y="268">BullMQ queues</text>
  <text class="s" x="830" y="296">complexity-queue</text>
  <text class="s" x="830" y="316">deadcode-queue</text>
  <text class="s" x="830" y="336">vuln-queue</text>
  <text class="s" x="830" y="356">coverage-queue</text>
  <text class="s" x="830" y="376">drift-queue</text>
  <text class="s" x="830" y="404">aggregator-queue</text>
  <text class="s" x="830" y="424">insights-queue · cluster-queue</text>
  <text class="m" x="830" y="460">5 attempts, exponential backoff</text>
  <text class="m" x="830" y="478">jobId = runId, so a duplicate add</text>
  <text class="m" x="830" y="494">is ignored</text>

  <!-- ============ WORKER ============ -->
  <rect x="1160" y="110" width="400" height="410" rx="12" fill="#ecf8f0" stroke="#2e8b57" stroke-width="1.8"/>
  <text class="h" x="1176" y="134">Worker · BullMQ · worker/  (separate process)</text>

  <rect class="item" x="1180" y="150" width="360" height="75" rx="8" stroke="#2e8b57"/>
  <text class="t" x="1194" y="172">Live progress events</text>
  <text class="s" x="1194" y="192">Each check publishes start / done;</text>
  <text class="s" x="1194" y="210">the aggregator publishes the final score</text>

  <rect class="item" x="1180" y="245" width="360" height="90" rx="8" stroke="#2e8b57"/>
  <text class="t" x="1194" y="267">withRunTracking × 5 checks (in parallel)</text>
  <text class="s" x="1194" y="288">complexity · vulnerabilities (npm audit)</text>
  <text class="s" x="1194" y="306">dead code · coverage</text>
  <text class="s" x="1194" y="324">drift (embeddings + pgvector similarity)</text>

  <rect class="core" x="1180" y="355" width="360" height="85" rx="8"/>
  <text class="t" x="1194" y="377">Save result, then hand off</text>
  <text class="s" x="1194" y="398">CategoryResult row, then ONE conditional UPDATE:</text>
  <text class="s" x="1194" y="416">exactly one worker queues the aggregator</text>

  <rect class="item" x="1180" y="455" width="175" height="50" rx="8" stroke="#2e8b57"/>
  <text class="t" x="1192" y="476">Aggregator</text>
  <text class="m" x="1192" y="494">score, Snapshot, findings</text>
  <rect class="core" x="1365" y="455" width="175" height="50" rx="8"/>
  <text class="t" x="1377" y="476">Sweeper (every 60 s)</text>
  <text class="m" x="1377" y="494">rescues stuck runs</text>

  <!-- ============ POSTGRES ============ -->
  <rect x="380" y="590" width="700" height="210" rx="12" fill="#f3effb" stroke="#7c5cc4" stroke-width="1.8"/>
  <text class="h" x="396" y="614">PostgreSQL + pgvector · source of truth</text>

  <rect class="chip" x="400" y="632" width="70" height="34" rx="8"/><text class="t" x="435" y="654" text-anchor="middle">Repo</text>
  <rect class="chipcore" x="482" y="632" width="120" height="34" rx="8"/><text class="t" x="542" y="654" text-anchor="middle">AnalysisRun</text>
  <rect class="chipcore" x="614" y="632" width="130" height="34" rx="8"/><text class="t" x="679" y="654" text-anchor="middle">CategoryResult</text>
  <rect class="chipcore" x="756" y="632" width="95" height="34" rx="8"/><text class="t" x="803" y="654" text-anchor="middle">Snapshot</text>
  <rect class="chip" x="863" y="632" width="85" height="34" rx="8"/><text class="t" x="905" y="654" text-anchor="middle">Finding</text>
  <rect class="chip" x="960" y="632" width="85" height="34" rx="8"/><text class="t" x="1002" y="654" text-anchor="middle">Insight</text>

  <rect class="chip" x="400" y="678" width="262" height="34" rx="8"/><text class="t" x="531" y="700" text-anchor="middle">FileAnalysis + 1536-dim embedding</text>
  <rect class="chip" x="674" y="678" width="85" height="34" rx="8"/><text class="t" x="716" y="700" text-anchor="middle">Cluster</text>
  <rect class="chip" x="771" y="678" width="70" height="34" rx="8"/><text class="t" x="806" y="700" text-anchor="middle">User</text>
  <rect class="chip" x="853" y="678" width="85" height="34" rx="8"/><text class="t" x="895" y="700" text-anchor="middle">ApiKey</text>
  <rect class="chip" x="950" y="678" width="95" height="34" rx="8"/><text class="t" x="997" y="700" text-anchor="middle">Chat*</text>

  <text class="s" x="400" y="745">Raw SQL only where Prisma can't: vector search and the atomic handoff UPDATE.</text>
  <text class="s" x="400" y="767">Unique rules make repeats harmless: (runId, category) · Snapshot.runId · (repoId, filePath)</text>
  <text class="s" x="400" y="789">Everything is read and written through Prisma by both the API and the worker.</text>

  <!-- ============ EXTERNAL ============ -->
  <rect x="1160" y="590" width="400" height="210" rx="12" fill="#f4f4f5" stroke="#71717a" stroke-width="1.8"/>
  <text class="h" x="1176" y="614">External services</text>
  <rect class="item" x="1180" y="632" width="175" height="62" rx="8" stroke="#71717a"/>
  <text class="t" x="1194" y="654">GitHub API</text><text class="m" x="1194" y="674">read files, post PR checks</text>
  <rect class="item" x="1365" y="632" width="175" height="62" rx="8" stroke="#71717a"/>
  <text class="t" x="1379" y="654">OpenAI</text><text class="m" x="1379" y="674">embeddings, chat, insights</text>
  <rect class="item" x="1180" y="706" width="175" height="62" rx="8" stroke="#71717a"/>
  <text class="t" x="1194" y="728">npm registry</text><text class="m" x="1194" y="748">npm audit (vulnerabilities)</text>
  <rect class="item" x="1365" y="706" width="175" height="62" rx="8" stroke="#71717a"/>
  <text class="t" x="1379" y="728">Resend</text><text class="m" x="1379" y="748">weekly digest emails</text>

  <!-- ============ MCP ============ -->
  <rect x="40" y="590" width="260" height="70" rx="12" fill="#fff7ea" stroke="#d08a00" stroke-width="1.8"/>
  <text class="h" x="56" y="616">AI assistant</text>
  <text class="s" x="56" y="638">Claude Desktop, IDE agents</text>
  <rect x="40" y="692" width="260" height="108" rx="12" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.8"/>
  <text class="h" x="56" y="718">MCP server · mcp/</text>
  <text class="s" x="56" y="740">stdio or HTTP + SSE transport</text>
  <text class="s" x="56" y="758">Re-exports api/services/tools.js</text>
  <text class="s" x="56" y="776">API keys checked as SHA-256 hashes</text>

  <!-- ============ ARROWS ============ -->
  <!-- 1: dashboard request, GitHub webhook / install -->
  <path class="line" d="M300 290 H400"/>
  <path class="line" d="M300 392 H350 V320 H400"/>
  <circle class="badge" cx="350" cy="290" r="13"/><text class="bt" x="350" y="295">1</text>
  <circle class="badge" cx="350" cy="365" r="13"/><text class="bt" x="350" y="370">1</text>
  <!-- Clerk verify -->
  <path class="dash" d="M400 486 H300"/>
  <text class="m" x="338" y="478" text-anchor="middle">verify JWT</text>
  <!-- 8: push to browser -->
  <path class="line" d="M400 190 H300"/>
  <circle class="badge" cx="350" cy="190" r="13"/><text class="bt" x="350" y="195">8</text>
  <!-- 2: insert run -->
  <path class="line" d="M550 520 V590"/>
  <circle class="badge" cx="550" cy="555" r="13"/><text class="bt" x="550" y="560">2</text>
  <text class="m" x="572" y="560">INSERT AnalysisRun first</text>
  <!-- 3: enqueue -->
  <path class="line" d="M700 400 H816"/>
  <circle class="badge" cx="758" cy="400" r="13"/><text class="bt" x="758" y="405">3</text>
  <!-- 4: worker takes jobs -->
  <path class="line" d="M1064 290 H1180"/>
  <circle class="badge" cx="1122" cy="290" r="13"/><text class="bt" x="1122" y="295">4</text>
  <!-- 7: progress to Redis, then Redis to API -->
  <path class="line" d="M1180 190 H1064"/>
  <circle class="badge" cx="1122" cy="190" r="13"/><text class="bt" x="1122" y="195">7</text>
  <path class="line" d="M816 190 H700"/>
  <circle class="badge" cx="758" cy="190" r="13"/><text class="bt" x="758" y="195">7</text>
  <!-- 5 and 6: worker saves to Postgres -->
  <path class="line" d="M1230 520 V560 H950 V590"/>
  <rect class="badge" x="1070" y="546" width="46" height="26" rx="13"/><text class="bt" x="1093" y="564">5 · 6</text>
  <text class="m" x="1093" y="538" text-anchor="middle">results, then snapshot</text>
  <!-- 4: worker calls out -->
  <path class="line" d="M1360 520 V590"/>
  <circle class="badge" cx="1360" cy="555" r="13"/><text class="bt" x="1360" y="560">4</text>
  <text class="m" x="1382" y="559">files, audit, embeddings</text>
  <!-- MCP -->
  <path class="line" d="M170 660 V692"/>
  <path class="dash" d="M300 746 H380"/>
  <text class="m" x="340" y="738" text-anchor="middle">reads</text>

  <!-- ============ LEGEND: the 8 steps ============ -->
  <line x1="40" y1="822" x2="1560" y2="822" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="h" x="40" y="850">One analysis in 8 steps</text>

  <circle class="badge" cx="53" cy="884" r="13"/><text class="bt" x="53" y="889">1</text>
  <text class="s" x="76" y="880">A request arrives: a pasted URL (with login JWT),</text>
  <text class="s" x="76" y="898">a GitHub push webhook, or an App install</text>
  <circle class="badge" cx="453" cy="884" r="13"/><text class="bt" x="453" y="889">2</text>
  <text class="s" x="476" y="880">The API inserts an AnalysisRun row (status</text>
  <text class="s" x="476" y="898">QUEUED) in Postgres, before anything else</text>
  <circle class="badge" cx="853" cy="884" r="13"/><text class="bt" x="853" y="889">3</text>
  <text class="s" x="876" y="880">The API adds 5 jobs to Redis; jobId = runId,</text>
  <text class="s" x="876" y="898">so a duplicate add is ignored. Then it replies.</text>
  <circle class="badge" cx="1253" cy="884" r="13"/><text class="bt" x="1253" y="889">4</text>
  <text class="s" x="1276" y="880">The worker runs the 5 checks in parallel,</text>
  <text class="s" x="1276" y="898">reading files from GitHub, npm and OpenAI</text>

  <circle class="badge" cx="53" cy="942" r="13"/><text class="bt" x="53" y="947">5</text>
  <text class="s" x="76" y="938">Each check saves a result row; one conditional</text>
  <text class="s" x="76" y="956">UPDATE lets exactly one worker queue aggregation</text>
  <circle class="badge" cx="453" cy="942" r="13"/><text class="bt" x="453" y="947">6</text>
  <text class="s" x="476" y="938">The aggregator computes the score and saves a</text>
  <text class="s" x="476" y="956">Snapshot, plus findings, insights and clusters</text>
  <circle class="badge" cx="853" cy="942" r="13"/><text class="bt" x="853" y="947">7</text>
  <text class="s" x="876" y="938">Workers publish progress to Redis pub/sub</text>
  <text class="s" x="876" y="956">as they go (a live signal, not stored)</text>
  <circle class="badge" cx="1253" cy="942" r="13"/><text class="bt" x="1253" y="947">8</text>
  <text class="s" x="1276" y="938">The API forwards it over Socket.IO, so the</text>
  <text class="s" x="1276" y="956">dashboard updates live. SUCCEEDED is set last.</text>

  <text class="m" x="40" y="994">*Chat = ChatSession and ChatMessage. Every step is safe to repeat, and the sweeper rescues any run left stuck by a crash.</text>
</svg>
